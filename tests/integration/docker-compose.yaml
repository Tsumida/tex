  oms_server:
    image: mvp_server:latest
    container_name: oms_server
    environment:
      - RUST_LOG=debug
      - SERVICE_NAME=oms_server
      - SERVER_MODE=oms
      - TRACE_ENDPOINT=http://jaeger:4317
      - GRPC_SERVER_ENDPOINT=0.0.0.0:8080
      - ENV=dev
    ports:
      - "8080:8080"
    depends_on:
      jaeger:
        condition: service_started
      kafka-dev:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully
      redis:
        condition: service_started

  me_BTCUSDT:
    image: mvp_server:latest
    container_name: me_BTCUSDT
    environment:
      - RUST_LOG=debug
      - SERVICE_NAME=me_BTCUSDT
      - ME_BASE=BTC
      - ME_QUOTE=USDT
      - SERVER_MODE=me
      - TRACE_ENDPOINT=http://jaeger:4317
      - GRPC_SERVER_ENDPOINT=0.0.0.0:8081
      - ENV=dev
    ports:
      - "8081:8081"
    depends_on:
      jaeger:
        condition: service_started
      kafka-dev:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully
      redis:
        condition: service_started

  me_ETHUSDT:
    image: mvp_server:latest
    container_name: me_ETHUSDT
    environment:
      - RUST_LOG=debug
      - SERVICE_NAME=me_ETHUSDT
      - ME_BASE=ETH
      - ME_QUOTE=USDT
      - SERVER_MODE=me
      - TRACE_ENDPOINT=http://jaeger:4317
      - GRPC_SERVER_ENDPOINT=0.0.0.0:8081
      - ENV=dev
    ports:
    # 端口映射
      - "18081:8081"
    depends_on:
      jaeger:
        condition: service_started
      kafka-dev:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully
      redis:
        condition: service_started

  mvp_tex:
    image: tex:latest
    container_name: mvp_tex
    environment:
      - SERVER_BIND_ADDR=0.0.0.0:8180
      - TRACE_ENDPOINT=http://jaeger:4317
      - KAFKA_BROKERS=kafka-dev:9092
      - REDIS_ADDR=redis:6379
      - ENV=dev
    ports:
      - "8180:8180"
    depends_on:
      jaeger:
        condition: service_started
      kafka-dev:
        condition: service_started
      kafka-init-topics:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  kafka_kraft_data: